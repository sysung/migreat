name: Package installation checks

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      wheel-url:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: ${{ runner.temp }}/dist
      - name: Install verification tools
        run: python -m pip install uv pipx
      - name: Install and verify the CLI
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ inputs.version }}
          WHEEL_URL: ${{ inputs.wheel-url }}
        run: |
          wheel="migreat-$VERSION-py3-none-any.whl"
          package="$PWD/dist/$wheel"
          if [[ -n "$WHEEL_URL" ]]; then
            python "$GITHUB_WORKSPACE/scripts/verify_release_download.py" "$WHEEL_URL" "$PWD/dist/SHA256.json"
            package="$WHEEL_URL"
          fi
          python "$GITHUB_WORKSPACE/scripts/smoke_package.py" "$package" "$VERSION" --venv "$PWD/package-venv" --all-installers
      - name: Exercise the installed CLI with PostgreSQL on Linux
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: package-venv/bin/python "$GITHUB_WORKSPACE/scripts/smoke_postgres.py" package-venv/bin/migreat "$GITHUB_WORKSPACE/tests/fixtures/orders-amount-cents.yaml"
      - name: Exercise the installed CLI with PostgreSQL on macOS
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}
        run: |
          brew install postgresql@17
          package-venv/bin/python "$GITHUB_WORKSPACE/scripts/smoke_postgres.py" package-venv/bin/migreat "$GITHUB_WORKSPACE/tests/fixtures/orders-amount-cents.yaml" --postgres-bin "$(brew --prefix postgresql@17)/bin"
      - name: Exercise the installed CLI with PostgreSQL on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          .\package-venv\Scripts\python.exe "$env:GITHUB_WORKSPACE/scripts/smoke_postgres.py" .\package-venv\Scripts\migreat.exe "$env:GITHUB_WORKSPACE/tests/fixtures/orders-amount-cents.yaml" --postgres-bin "$env:PGBIN"
