name: Python package release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: python-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: github.event_name == 'push'
        run: python scripts/release_package.py --ref "$GITHUB_REF"
      - name: Record package version and commit
        id: metadata
        run: |
          python -c 'import tomllib; print("version=" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and verify distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/release_package.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  platforms:
    needs: build
    uses: ./.github/workflows/package-smoke.yml
    with:
      version: ${{ needs.build.outputs.version }}

  linux-integration:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: ${{ runner.temp }}/dist
      - name: Run the PostgreSQL integration suite against the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv integration
          source integration/bin/activate
          python -m pip install dist/*.whl
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Check installation from the source distribution
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_package.py" "$PWD/dist/migreat-$VERSION.tar.gz" "$VERSION" --venv "$PWD/sdist"
      - name: Check the Docker CLI
        run: |
          docker build -t migreat .
          docker run --rm migreat --help
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Smoke-test the latest stable Python
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_package.py" "$PWD/dist/migreat-$VERSION-py3-none-any.whl" "$VERSION" --venv "$PWD/latest"

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, platforms, linux-integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      wheel-url: ${{ steps.publish.outputs.wheel-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish the verified release assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$RELEASE_COMMIT"
          wheel="migreat-$VERSION-py3-none-any.whl"
          sdist="migreat-$VERSION.tar.gz"
          jq -er --arg wheel "$wheel" --arg sdist "$sdist" \
            'select(keys == ([$wheel, $sdist] | sort)) | to_entries[] | "\(.value)  \(.key)"' \
            dist/SHA256.json > expected.sha256
          (cd dist && sha256sum --strict --check ../expected.sha256)
          release_id=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .id")
          if [[ -z "$release_id" ]]; then
            gh release create "$tag" --verify-tag --draft --title "Migreat $tag" --generate-notes
            release_id=$(gh api "repos/$GH_REPO/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$tag\") | .id")
          fi
          release=$(gh api "repos/$GH_REPO/releases/$release_id")
          assets=$(gh api "repos/$GH_REPO/releases/$release_id/assets" --paginate --slurp | jq -c 'add')
          for name in "$wheel" "$sdist" SHA256.json; do
            existing=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<< "$assets")
            if [[ -n "$existing" ]]; then
              gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$existing" > existing-asset
              cmp "dist/$name" existing-asset
            else
              test "$(jq -r .draft <<< "$release")" = true
              gh release upload "$tag" "dist/$name"
            fi
          done
          if [[ "$(jq -r .draft <<< "$release")" == true ]]; then
            gh release edit "$tag" --draft=false
          fi
          echo "wheel-url=$GITHUB_SERVER_URL/$GH_REPO/releases/download/$tag/$wheel" >> "$GITHUB_OUTPUT"
          echo "Release: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

  public-install:
    needs: [build, publish]
    uses: ./.github/workflows/package-smoke.yml
    with:
      version: ${{ needs.build.outputs.version }}
      wheel-url: ${{ needs.publish.outputs.wheel-url }}
