name: Python package release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: python-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record package version and commit
        id: metadata
        run: |
          python -c 'import tomllib; print("version=" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$VERSION"
          git merge-base --is-ancestor HEAD origin/master
      - name: Build distributions and record checksums
        run: |
          python -m pip install build
          python -m build
          python - <<'PYTHON'
          import hashlib
          import json
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          dist = Path("dist")
          names = [f"migreat-{version}-py3-none-any.whl", f"migreat-{version}.tar.gz"]
          if set(dist.iterdir()) != {dist / name for name in names}:
              raise SystemExit("Expected exactly the versioned wheel and source distribution")
          hashes = {name: hashlib.sha256((dist / name).read_bytes()).hexdigest() for name in names}
          (dist / "SHA256.json").write_text(json.dumps(hashes, indent=2) + "\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish the verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          test "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$RELEASE_COMMIT"
          wheel="migreat-$VERSION-py3-none-any.whl"
          sdist="migreat-$VERSION.tar.gz"
          jq -er --arg wheel "$wheel" --arg sdist "$sdist" \
            'select(keys == ([$wheel, $sdist] | sort)) | to_entries[] | "\(.value)  \(.key)"' \
            dist/SHA256.json > expected.sha256
          (cd dist && sha256sum --strict --check ../expected.sha256)
          release_id=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .id")
          if [[ -z "$release_id" ]]; then
            gh release create "$tag" --verify-tag --draft --title "Migreat $tag" --generate-notes
            release_id=$(gh api "repos/$GH_REPO/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$tag\") | .id")
          fi
          release=$(gh api "repos/$GH_REPO/releases/$release_id")
          assets=$(gh api "repos/$GH_REPO/releases/$release_id/assets" --paginate --slurp | jq -c 'add')
          for name in "$wheel" "$sdist" SHA256.json; do
            existing=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<< "$assets")
            if [[ -n "$existing" ]]; then
              gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$existing" > existing-asset
              cmp "dist/$name" existing-asset
            else
              test "$(jq -r .draft <<< "$release")" = true
              gh release upload "$tag" "dist/$name"
            fi
          done
          if [[ "$(jq -r .draft <<< "$release")" == true ]]; then
            gh release edit "$tag" --draft=false
          fi
          echo "Release: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
