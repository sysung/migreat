[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "migreat"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["psycopg[binary]>=3,<4", "PyYAML>=6,<7"]

[project.scripts]
migreat = "migreat.cli:main"

[tool.setuptools]
packages = ["migreat"]
